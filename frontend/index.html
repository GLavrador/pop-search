<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/windows-98-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pop Search</title>
    <script>
      // Dark from the first paint when the boot screen is about to play.
      if (!sessionStorage.getItem('pop-search:booted')) document.documentElement.dataset.boot = '';
    </script>
    <style>
      html[data-boot] body {
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
